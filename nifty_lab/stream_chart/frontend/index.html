<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #0e1117; color: #d1d4dc; font-family: sans-serif; }
    #mount { width: 100%; height: 440px; }
    #meta { font-size: 11px; padding: 4px 6px; opacity: 0.8; }
  </style>
</head>
<body>
  <div id="mount"></div>
  <div id="meta"></div>
  <script>
    // Minimal Streamlit component bridge. The npm streamlit-component-lib ships only an ES module, which a
    // plain <script> tag cannot execute, so speak the (stable, v1) postMessage protocol directly.
    const post = (type, data) => window.parent.postMessage({ isStreamlitMessage: true, type, ...data }, "*");
    const MOUNT_ID = "mount";
    const KEY = "__nslLwc_spec14";

    function applyBars(slot, data) {
      // Replace the whole series every render: the Python side already owns the bounded window
      // (MAX_RETAINED_BARS), so append, rolling, shrink, clear and restart all stay in sync.
      // series.update() cannot drop bars that left the window; setData() keeps the user's
      // bar spacing / right offset, so the viewport is preserved.
      slot.series.setData(data || []);
      slot.updateCount = (slot.updateCount || 0) + 1;
    }

    function ensureChart() {
      if (window[KEY]) {
        return window[KEY];
      }
      const el = document.getElementById(MOUNT_ID);
      const chart = LightweightCharts.createChart(el, {
        layout: { background: { color: "#0e1117" }, textColor: "#d1d4dc" },
        grid: { vertLines: { color: "#2a2e39" }, horzLines: { color: "#2a2e39" } },
        timeScale: { timeVisible: true, secondsVisible: false },
        rightPriceScale: { borderColor: "#2a2e39" },
      });
      const series = chart.addCandlestickSeries();
      const slot = { chart, series, instanceId: crypto.randomUUID(), updateCount: 0 };
      window[KEY] = slot;
      window.addEventListener("resize", () => chart.applyOptions({ width: el.clientWidth }));
      return slot;
    }

    function onRender(args) {
      const bars = args.bars || [];
      const slot = ensureChart();
      applyBars(slot, bars);
      document.getElementById("meta").textContent =
        `instance=${slot.instanceId} updates=${slot.updateCount} bars=${bars.length}`;
      post("streamlit:setFrameHeight", { height: document.body.scrollHeight });
      post("streamlit:setComponentValue", {
        value: { instanceId: slot.instanceId, updateCount: slot.updateCount, barCount: bars.length },
        dataType: "json",
      });
    }

    window.addEventListener("message", (event) => {
      if (event.data && event.data.type === "streamlit:render") {
        onRender(event.data.args || {});
      }
    });
    post("streamlit:componentReady", { apiVersion: 1 });
  </script>
</body>
</html>
