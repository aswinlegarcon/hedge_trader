<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script src="https://unpkg.com/streamlit-component-lib@2.0.0/dist/index.js"></script>
  <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    html, body { margin: 0; padding: 0; background: #0e1117; color: #d1d4dc; font-family: sans-serif; }
    #mount { width: 100%; height: 440px; }
    #meta { font-size: 11px; padding: 4px 6px; opacity: 0.8; }
  </style>
</head>
<body>
  <div id="mount"></div>
  <div id="meta"></div>
  <script>
    const Streamlit = window.Streamlit;
    const MOUNT_ID = "mount";
    const KEY = "__nslLwc_spec14";

    function applyBars(slot, data) {
      if (!data || data.length === 0) {
        slot.series.setData([]);
        slot.lastCount = 0;
        slot.updateCount = (slot.updateCount || 0) + 1;
        return;
      }
      const prev = slot.lastCount || 0;
      if (prev === 0) {
        slot.series.setData(data);
      } else if (data.length === prev) {
        slot.series.update(data[data.length - 1]);
      } else if (data.length > prev) {
        if (data.length >= 2) {
          slot.series.update(data[data.length - 2]);
        }
        slot.series.update(data[data.length - 1]);
      } else {
        slot.series.setData(data);
      }
      slot.lastCount = data.length;
      slot.updateCount = (slot.updateCount || 0) + 1;
    }

    function ensureChart() {
      if (window[KEY]) {
        return window[KEY];
      }
      const el = document.getElementById(MOUNT_ID);
      const chart = LightweightCharts.createChart(el, {
        layout: { background: { color: "#0e1117" }, textColor: "#d1d4dc" },
        grid: { vertLines: { color: "#2a2e39" }, horzLines: { color: "#2a2e39" } },
        timeScale: { timeVisible: true, secondsVisible: false },
        rightPriceScale: { borderColor: "#2a2e39" },
      });
      const series = chart.addCandlestickSeries();
      const slot = { chart, series, instanceId: crypto.randomUUID(), lastCount: 0, updateCount: 0 };
      window[KEY] = slot;
      window.addEventListener("resize", () => chart.applyOptions({ width: el.clientWidth }));
      return slot;
    }

    function onRender(event) {
      const args = event.detail.args || {};
      const bars = args.bars || [];
      const reset = !!args.reset;
      const slot = ensureChart();
      if (reset) {
        slot.series.setData([]);
        slot.lastCount = 0;
      }
      applyBars(slot, bars);
      document.getElementById("meta").textContent =
        `instance=${slot.instanceId} updates=${slot.updateCount} bars=${bars.length}`;
      Streamlit.setComponentValue({
        instanceId: slot.instanceId,
        updateCount: slot.updateCount,
        barCount: bars.length,
      });
    }

    Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
    Streamlit.setComponentReady();
  </script>
</body>
</html>
