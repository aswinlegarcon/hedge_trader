[project]
name = "nifty-signal-lab"
version = "0.1.0"
description = "Read-only NIFTY market research, options payoff analysis and paper-trading journal (no live trading)."
requires-python = ">=3.12"
dependencies = [
  "streamlit>=1.38",
  "pandas>=2.2",
  "numpy>=1.26",
  "plotly>=5.22",
  "scipy>=1.13",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "playwright>=1.49"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 160
target-version = "py312"
